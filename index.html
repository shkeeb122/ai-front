 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Marketing Automation</title>

  <!-- GOOGLE FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="top-bar">
    <div class="logo">🚀 AI Marketing</div>
    <div class="subtitle">Smart Automation Dashboard</div>
</header>

<!-- ================= MAIN ================= -->
<main class="app">
<div class="container">

  <!-- ========= SIDEBAR ========= -->
  <aside class="sidebar">
      <h2>⚡ Campaigns</h2>
      <div id="campaign_list">
          <p class="muted">No campaigns yet...</p>
      </div>
  </aside>

  <!-- ========= MAIN PANEL ========= -->
  <section class="main-panel">

    <!-- ===== COMMAND BOX ===== -->
    <section class="command-box glow">
        <h2>🧠 Run AI Command</h2>

        <textarea id="command_input"
        placeholder="Create affiliate campaign, generate blog, automate marketing..."></textarea>

        <button class="primary" onclick="runCommand()">🚀 Run Command</button>
        <p id="status_indicator" class="muted">Status: Idle</p>
    </section>

    <!-- ===== RESULT BOX ===== -->
    <section class="result-box">
        <h2>📊 System Result</h2>
        <div id="result">
            <p class="muted">No command executed yet...</p>
        </div>
    </section>

    <!-- ===== CHAT SYSTEM ===== -->
    <section class="history-box">

        <h2>💬 Campaign Chat</h2>

        <!-- CHAT DISPLAY -->
        <div id="history_result" class="chat-box">
            <p class="muted">Start conversation...</p>
        </div>

        <!-- CHAT INPUT -->
        <div class="chat-input">
            <textarea id="chat_input" placeholder="Ask anything..."></textarea>
            <button class="primary" onclick="sendChat()">➤</button>
        </div>

    </section>

  </section>

</div>
</main>

<!-- ================= FOOTER ================= -->
<footer class="footer">
    ⚡ AI Marketing System • PRO Automation Mode
</footer>

<script src="script.js"></script>

</body>
</html>
