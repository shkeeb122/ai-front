 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Marketing Automation</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top-bar">
  <div class="logo">🚀 AI Marketing</div>
  <div class="subtitle">Smart Automation Dashboard</div>
</header>
<main class="app">
<div class="container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>⚡ Campaigns</h2>
    <div id="campaign_list">
      <p class="muted">No campaigns yet...</p>
    </div>
    <h2>📝 Memory History</h2>
    <div id="memory_list">
      <p class="muted">No memory yet...</p>
    </div>
    <button class="primary" onclick="clearMemory()">🗑️ Clear Memory</button>
  </aside>

  <!-- Chat Panel -->
  <section class="main-panel">
    <div class="chat-container">
      <div id="history_result" class="chat-box">
        <p class="muted">Start conversation...</p>
      </div>
      <div class="chat-input">
        <textarea id="chat_input" placeholder="Type command or question..."></textarea>
        <button class="primary" onclick="sendChat()">➤</button>
      </div>
      <p id="status_indicator" class="muted">Status: Idle</p>
    </div>
  </section>
</div>
</main>
<footer class="footer">
⚡ AI Marketing System • PRO Automation Mode
</footer>
<script src="script.js"></script>
</body>
</html>
