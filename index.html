<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Marketing System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-bar">
    <h1>AI Marketing System</h1>
</div>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Campaigns</h2>
        <input type="text" id="campaign_search" placeholder="Search campaign..." oninput="filterCampaigns()">
        <div id="campaign_list"></div>
    </div>

    <!-- Main Panel -->
    <div class="main-panel">

        <!-- Command Box -->
        <div class="command-box">
            <textarea id="command_input" placeholder="Enter your command here..."></textarea>
            <button class="primary" onclick="runCommand()">Run Command</button>
            <p id="status_indicator">Status: Idle</p>
        </div>

        <!-- Result Box -->
        <div class="result-box" id="result">
            <p class="muted">Results will appear here...</p>
        </div>

        <!-- History Box -->
        <div class="history-box" id="history_result">
            <p class="muted">No saved history</p>
        </div>

    </div>

</div>

<div class="footer">
    AI Marketing System - 2026
</div>

<script src="app.js"></script>
</body>
</html>
