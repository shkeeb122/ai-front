<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Alert System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="top-bar">
    <h1>Smart Alert & Reminder</h1>
    <p>Set smart reminders for your important tasks.</p>
  </header>

  <main class="app">

    <!-- ===== Add Alert ===== -->
    <section class="alert-section">
      <h2>➕ Add New Reminder</h2>

      <label>Alert Type:
        <select id="alert_type">
          <option value="subscription">Subscription</option>
          <option value="bill">Bill Payment</option>
          <option value="insurance">Insurance</option>
          <option value="document">Document</option>
          <option value="custom">Custom</option>
        </select>
      </label>

      <label>Title:
        <input type="text" id="alert_title" placeholder="Example: Mobile Recharge">
      </label>

      <label>Country:
        <select id="alert_country">
          <option value="India">India</option>
          <option value="USA">USA</option>
        </select>
      </label>

      <label>Due Date:
        <input type="date" id="alert_due">
      </label>

      <label>Reminder Days Before:
        <input type="number" id="alert_reminder" value="1">
      </label>

      <button class="primary" onclick="submitAlert()">Save Reminder</button>
    </section>

    <!-- ===== Due Alerts ===== -->
    <section class="due-section">
      <h2>⏰ Upcoming Reminders</h2>

      <div id="due_alerts">
        <p class="muted">No reminders yet…</p>
      </div>

      <button class="secondary" onclick="showDueAlerts()">Refresh</button>
    </section>

  </main>

  <footer class="footer">
    © 2026 Smart Reminder System
  </footer>

  <script src="script.js"></script>
</body>
</html>
