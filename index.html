<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ultimate Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- ================= SECTION 1: APP CONTAINER ================= -->
<div class="app">

    <!-- ================= SECTION 2: SIDEBAR (Chat History) ================= -->
    <aside class="sidebar" id="sidebar">
        <!-- 2.1 Sidebar Header -->
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-brain"></i>
                <h2>AI Ultimate Pro</h2>
            </div>
            <button class="new-chat-btn" onclick="newChat()">
                <i class="fas fa-plus"></i> New Chat
            </button>
        </div>
        
        <!-- 2.2 Chat History List -->
        <div class="history-section">
            <div class="history-header">
                <i class="fas fa-history"></i>
                <span>Chat History</span>
                <button class="clear-all-btn" onclick="clearAllChats()" title="Clear All">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
            <div id="campaign_list" class="history-list"></div>
        </div>
        
        <!-- 2.3 Sidebar Footer -->
        <div class="sidebar-footer">
            <div class="user-info">
                <i class="fas fa-user-circle"></i>
                <span>Guest User</span>
            </div>
            <div class="stats-badge" onclick="showStats()">
                <i class="fas fa-chart-line"></i>
                <span id="totalQuestions">0</span>
            </div>
        </div>
    </aside>

    <!-- ================= SECTION 3: MAIN CHAT AREA ================= -->
    <main class="chat-container">
        
        <!-- 3.1 Chat Header -->
        <div class="chat-header">
            <button class="menu-toggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <div class="chat-info">
                <i class="fas fa-comment-dots"></i>
                <span id="chatTitle">New Conversation</span>
            </div>
            <button class="action-btn" onclick="exportChat()">
                <i class="fas fa-download"></i>
            </button>
        </div>

        <!-- 3.2 Messages Area -->
        <div id="history_result" class="chat-area"></div>

        <!-- 3.3 Input Area -->
        <div class="chat-input-container">
            <div class="suggestions-bar">
                <button class="suggestion-chip" onclick="setCommand('Blog banao')">📝 Blog banao</button>
                <button class="suggestion-chip" onclick="setCommand('Maine kitne sawal kiye?')">📊 Kitne sawal?</button>
                <button class="suggestion-chip" onclick="setCommand('Pehle kya hua tha?')">📜 Pehle kya hua?</button>
                <button class="suggestion-chip" onclick="setCommand('Aur batao')">💬 Aur batao</button>
            </div>
            <div class="input-wrapper">
                <textarea id="chat_input" placeholder="Type your message..." rows="1"></textarea>
                <button onclick="sendChat()" class="send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>
</div>

<!-- ================= SECTION 4: MODALS ================= -->
<div id="statsModal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Statistics</h3>
            <button class="modal-close" onclick="closeStats()">&times;</button>
        </div>
        <div class="modal-body">
            <p>Total Messages: <span id="statTotalMessages">0</span></p>
            <p>Total Questions: <span id="statTotalQuestions">0</span></p>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
