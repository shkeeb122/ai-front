<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Marketing Automation</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-bar">
<h1>AI Marketing Automation</h1>
<p>Command based affiliate marketing system</p>
</header>

<main class="app">

<section class="command-box">
<h2>Run AI Command</h2>
<textarea id="command_input"
placeholder="Example: create affiliate marketing campaign for fitness products in USA"></textarea>
<button class="primary" onclick="runCommand()">Run Command</button>
</section>

<section class="result-box">
<h2>System Result</h2>
<div id="result">
<p class="muted">No command executed yet...</p>
</div>
</section>

<section class="history-box" style="display:none;">
<h2>Campaign History</h2>
<div id="history_result">
<p class="muted">Select a campaign first...</p>
</div>
</section>

</main>

<footer class="footer">
AI Marketing System
</footer>

<script src="script.js"></script>
</body>
</html>
