<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Alert & Message Analyzer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar">
    <h1>Smart Alert & Message Analyzer</h1>
    <p>Apne alerts aur messages ko manage karein. Alerts ka AI guidance bhi milega. Hindi/Hinglish me simple samjhaya jaayega!</p>
  </header>

  <main class="app">

    <!-- ===== Add Alert Section ===== -->
    <section class="alert-section">
      <h2>Add New Alert</h2>
      <label>Alert Type:
        <select id="alert_type">
          <option value="subscription">Subscription</option>
          <option value="address_change">Address Change</option>
          <option value="tax_bill">Tax / Bill</option>
          <option value="insurance_loan">Insurance / Loan</option>
          <option value="document_event">Document Event</option>
        </select>
      </label>
      <label>Title: <input type="text" id="alert_title" placeholder="Alert title"></label>
      <label>Country:
        <select id="alert_country">
          <option value="USA">USA</option>
          <option value="India">India</option>
        </select>
      </label>
      <label>Due Date: <input type="date" id="alert_due"></label>
      <label>Reminder Days: <input type="number" id="alert_reminder" value="1"></label>
      <button class="primary" onclick="submitAlert()">Add Alert</button>
    </section>

    <!-- ===== Due Alerts Section ===== -->
    <section class="due-section">
      <h2>Due Alerts</h2>
      <div id="due_alerts">
        <p class="muted">Due alerts yahan dikhai denge…</p>
      </div>
      <button class="secondary" onclick="showDueAlerts()">Refresh Alerts</button>
    </section>

    <!-- ===== Message Analyzer Section ===== -->
    <section class="input-section">
      <h2>Message Analyzer</h2>
      <textarea id="msg" rows="6" placeholder="Yahan apna message paste karo..."></textarea>
      <div class="controls">
        <button class="primary" onclick="sendMsg()">Analyze</button>
        <button class="danger" onclick="clearMsg()">Clear</button>
      </div>
      <div id="result" class="result-box">
        <p class="muted">Result yahan dikhai dega…</p>
      </div>
    </section>

  </main>

  <footer class="footer">
    © 2026 Smart Alert & Message Analyzer
  </footer>

  <script src="script.js"></script>
</body>
</html>
